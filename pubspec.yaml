name: samrudhi_delivery_agent_app
description: "Samrudhi Delivery Agent App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  responsive_framework: ^1.5.1
  persistent_bottom_nav_bar: ^6.2.1
  fl_chart: ^1.1.1
  remixicon: ^1.4.1
  in_app_review: ^2.0.11
  package_info_plus: ^9.0.0
  shared_preferences: ^2.5.4
  http: ^1.6.0
  connectivity_plus: ^6.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  avatar_glow: ^3.0.1
  awesome_snackbar_content: ^0.1.8
  animations: ^2.1.1
  internet_connection_checker: ^3.0.1
  flutter_image_compress: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# --------------------------------------------------
# App Launcher Icon Configuration (ROOT LEVEL)
# --------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# --------------------------------------------------
# Flutter Section (ONLY assets, fonts, etc.)
# --------------------------------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
